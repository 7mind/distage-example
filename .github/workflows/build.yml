name: Build

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches: [ "develop" ]
    tags: [ "v**" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  sbt-test:
    runs-on: ubuntu-latest
    steps:
    - uses: sbt/setup-sbt@v1 # setup sbt
    - uses: actions/checkout@v5
    - name: Run tests
      run: sbt +test

  sim-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: sbt/setup-sbt@v1
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
    - name: Link Scala.js bundles into JVM resources
      run: sbt copySimJs
    - name: Smoke-test the simulation bundle via node
      run: node bifunctor-tagless/js/sim-smoke.js
    - name: Smoke-test the testkit bundle via node
      run: node bifunctor-tagless/js/test-smoke.js

  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: sbt/setup-sbt@v1 # setup sbt
      - uses: actions/checkout@v5
      - name: Build native app
        run: sbt "project bifunctor-taglessJVM; GraalVMNativeImage/packageBin"
      - name: Check native app
        run: ./bifunctor-tagless/jvm/target/graalvm-native-image/bifunctor-tagless :help
